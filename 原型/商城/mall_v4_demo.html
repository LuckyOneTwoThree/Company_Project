<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Node 商城 v4.2 - 短号中心迁移+交易模块优化</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        lightbg: '#f5f6f8',
                        'slate-955': '#0f172a',
                        'slate-655': '#475569',
                        'indigo-55': '#6366f1',
                        'indigo-650': '#4f46e5',
                        brand: '#6d5efc',
                        'brand-dark': '#5b4ed6',
                        'brand-light': '#8b7fff',
                        'warn': '#f59e0b',
                        'danger': '#dc2626',
                        'success': '#10b981',
                    },
                    fontFamily: {
                        display: ['Outfit', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Space Grotesk', sans-serif; background: #e9eaf0; margin: 0; padding: 0; }
        .font-display { font-family: 'Outfit', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', 'monospace'; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .overlay-blur { background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(10px); }
        .active-scale { transition: transform 0.12s ease; }
        .active-scale:active { transform: scale(0.96); }
        .card-shadow { box-shadow: 0 1px 2px rgba(15,23,42,0.04), 0 4px 12px rgba(15,23,42,0.04); }
        .card-shadow-lg { box-shadow: 0 4px 24px rgba(109,94,252,0.12), 0 1px 3px rgba(15,23,42,0.06); }
        .card-shadow-warn { box-shadow: 0 4px 24px rgba(245,158,11,0.18), 0 1px 3px rgba(15,23,42,0.06); }
        .card-shadow-danger { box-shadow: 0 4px 24px rgba(220,38,38,0.18), 0 1px 3px rgba(15,23,42,0.06); }
        .fade-in { animation: fadeIn 0.25s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .scale-in { animation: scaleIn 0.2s ease-out; }
        @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .gradient-brand { background: linear-gradient(135deg, #6d5efc 0%, #8b7fff 100%); }
        .gradient-dark { background: linear-gradient(135deg, #1e293b 0%, #334155 100%); }
        .gradient-gold { background: linear-gradient(135deg, #f59e0b 0%, #f97316 100%); }
        .gradient-success { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        .gradient-danger { background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%); }
        .gradient-warn { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
        .pill-active { background: white; color: #0f172a; border-radius: 9999px; }
        .pill-inactive { color: rgba(255,255,255,0.7); background: transparent; padding-left: 0.5rem !important; padding-right: 0.5rem !important; justify-content: center !important; }
        .pill-inactive .tab-label { display: none; }
        .product-img-fade { background: linear-gradient(135deg, #f8f9ff 0%, #eef0ff 100%); }
        .tag-stockout { background: #fee2e2; color: #dc2626; }
        .img-dot { width: 6px; height: 6px; border-radius: 50%; background: #cbd5e1; }
        .img-dot.active { background: #6d5efc; width: 18px; border-radius: 3px; }
        .rank-pill { background: linear-gradient(135deg, #f59e0b, #f97316); color: white; }
        .role-float { font-family: 'Space Grotesk', sans-serif; }
        .role-btn { transition: all 0.15s ease; cursor: pointer; }
        .role-btn:hover { transform: translateX(2px); }
        .role-btn.active { background: #6d5efc !important; color: white !important; border-color: #6d5efc !important; }
        .alert-p0 { border-left: 4px solid #dc2626; background: #fef2f2; }
        .alert-p1 { border-left: 4px solid #f59e0b; background: #fffbeb; }
        .alert-info { border-left: 4px solid #6d5efc; background: #f5f3ff; }
        .badge-p0 { background: #dc2626; color: white; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 700; }
        .badge-p1 { background: #f59e0b; color: white; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 700; }
        .badge-info { background: #6d5efc; color: white; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 700; }
        .badge-success { background: #10b981; color: white; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 700; }
        /* 状态徽章对齐《交易订单状态设计方案》§6.2 */
        .badge-pending { background: #fef3c7; color: #b45309; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 700; }   /* 待发货/待领取 橙 */
        .badge-shipped { background: #dbeafe; color: #1d4ed8; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 700; }    /* 已发货 蓝 */
        .badge-completed { background: #d1fae5; color: #047857; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 700; }  /* 已完成 绿 */
        .badge-returning { background: #fed7aa; color: #c2410c; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 700; }/* 退货申请中 琥珀 */
        .badge-returned { background: #f1f5f9; color: #64748b; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 700; }    /* 已退货 灰 */
        .badge-rejected { background: #fee2e2; color: #b91c1c; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 700; }  /* 退货被拒 红 */
        .check-passed { color: #10b981; }
        .check-failed { color: #dc2626; }
        .check-pending { color: #f59e0b; }
        .view { display: none; }
        .view.active { display: block; }
        .tab-btn { transition: all 0.15s ease; }
        .tab-btn.active { color: #6d5efc; border-bottom: 2px solid #6d5efc; }
        .input-field { width: 100%; padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; outline: none; transition: border-color 0.15s; }
        .input-field:focus { border-color: #6d5efc; }
        .btn-primary { background: #6d5efc; color: white; padding: 12px; border-radius: 10px; font-weight: 600; text-align: center; transition: all 0.15s; }
        .btn-primary:active { transform: scale(0.98); }
        .btn-primary:disabled { background: #cbd5e1; color: #94a3b8; cursor: not-allowed; transform: none; }
        .btn-secondary { background: #f1f5f9; color: #475569; padding: 12px; border-radius: 10px; font-weight: 600; text-align: center; }
        .btn-danger { background: #dc2626; color: white; padding: 12px; border-radius: 10px; font-weight: 600; }
        .btn-success { background: #10b981; color: white; padding: 12px; border-radius: 10px; font-weight: 600; }
        .pin-dot { width: 16px; height: 16px; border: 2px solid #cbd5e1; border-radius: 50%; transition: all 0.15s; }
        .pin-dot.filled { background: #6d5efc; border-color: #6d5efc; }
        .pin-input { width: 40px; height: 50px; text-align: center; font-size: 24px; border: 2px solid #e2e8f0; border-radius: 8px; outline: none; }
        .pin-input:focus { border-color: #6d5efc; }
        .progress-bar { height: 6px; background: #e2e8f0; border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #6d5efc, #8b7fff); border-radius: 3px; transition: width 0.3s; }
        .progress-fill.warn { background: linear-gradient(90deg, #f59e0b, #f97316); }
        .progress-fill.danger { background: linear-gradient(90deg, #dc2626, #b91c1c); }
        .slider-track { height: 6px; background: #e2e8f0; border-radius: 3px; position: relative; }
        .slider-fill { height: 100%; background: linear-gradient(90deg, #f59e0b, #f97316); border-radius: 3px; }
        .slider-thumb { width: 20px; height: 20px; background: white; border: 3px solid #f59e0b; border-radius: 50%; position: absolute; top: 50%; transform: translate(-50%, -50%); cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
        .code-block { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #475569; overflow-x: auto; }
        .copy-btn { cursor: pointer; color: #6d5efc; font-size: 12px; }
    </style>
</head>
<body>

<!-- ========================================================== -->
<!-- v4.0 角色切换浮层（4档·双视角·对齐 v1.5 方案） -->
<!-- ========================================================== -->
<div id="role-float" class="role-float" style="position:fixed; top:12px; left:12px; z-index:9999; background:white; border:1px solid #e2e8f0; border-radius:14px; padding:10px; box-shadow:0 8px 24px rgba(0,0,0,0.12); width:360px; max-height:92vh; overflow-y:auto;">
    <div class="flex items-center justify-between mb-2.5">
        <div class="text-[11px] font-black text-slate-700 flex items-center space-x-1">
            <span>👤</span><span>角色预览切换 v4（3档·双视角）</span>
        </div>
        <button onclick="toggleRoleFloat()" class="text-slate-400 hover:text-slate-700 text-[10px] font-bold w-5 h-5 rounded bg-slate-100">−</button>
    </div>
    <div class="grid grid-cols-3 gap-1.5 mb-2.5">
        <button onclick="switchRole('guest')" id="role-btn-guest" class="role-btn text-[10px] font-bold px-2 py-2 rounded-md border border-slate-200 bg-white text-slate-600 flex items-center justify-center space-x-1">
            <span>🚶</span><span>游客</span>
        </button>
        <button onclick="switchRole('buyer')" id="role-btn-buyer" class="role-btn text-[10px] font-bold px-2 py-2 rounded-md border border-slate-200 bg-white text-slate-600 flex items-center justify-center space-x-1">
            <span>🛒</span><span>买家</span>
        </button>
        <button onclick="switchRole('agent')" id="role-btn-agent" class="role-btn active text-[10px] font-bold px-2 py-2 rounded-md border border-slate-200 bg-white text-slate-600 flex items-center justify-center space-x-1">
            <span>🏅</span><span>代理</span>
        </button>
    </div>
    <div id="role-detail" class="min-w-0"></div>
</div>

<div id="role-float-mini" style="position:fixed; top:12px; left:12px; z-index:9999; display:none; width:36px; height:36px; border-radius:50%; background:#6d5efc; color:white; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 4px 12px rgba(109,94,252,0.4);" onclick="toggleRoleFloat()">
    <span class="text-sm">👤</span>
</div>

<!-- ========================================================== -->
<!-- 手机模拟容器 390×844 -->
<!-- ========================================================== -->
<div id="phone-frame" style="width:390px; height:844px; margin:12px auto; background:#f5f6f8; border-radius:40px; overflow:hidden; position:relative; box-shadow:0 20px 60px rgba(0,0,0,0.15), 0 0 0 12px #1e293b;">

    <!-- iOS 状态栏 -->
    <div style="position:absolute; top:0; left:0; right:0; height:44px; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:0 24px; font-size:14px; font-weight:600; color:#0f172a; background:white;">
        <span>9:41</span>
        <div style="display:flex; align-items:center; gap:6px;">
            <span style="font-size:10px;">📶</span>
            <span style="font-size:10px;">🔋</span>
        </div>
    </div>

    <!-- ========== view-mall 商城首页 ========== -->
    <div id="view-mall" class="view active" style="position:absolute; top:44px; left:0; right:0; bottom:0; overflow-y:auto; z-index:10;">
        <!-- Banner -->
        <div class="gradient-brand text-white px-4 pt-3 pb-5 rounded-b-3xl">
            <div class="flex items-center justify-between mb-3">
                <div>
                    <div class="text-[11px] opacity-80 font-medium">R9 商城 · v4.2</div>
                    <div class="text-lg font-display font-bold">官方统一商品池</div>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="openSearch()" class="w-9 h-9 rounded-full bg-white bg-opacity-20 flex items-center justify-center">🔍</button>
                </div>
            </div>
            <div class="text-[11px] opacity-80">级差返利自动分润 · 等级驱动收益</div>
        </div>

        <!-- 4 大功能入口 -->
        <div class="px-4 mt-3">
            <div class="bg-white rounded-2xl p-3 card-shadow">
                <div class="grid grid-cols-4 gap-2">
                    <button onclick="switchTab('orders')" class="flex flex-col items-center gap-1 py-1.5 active-scale">
                        <div class="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center text-lg">📋</div>
                        <span class="text-[10px] font-bold text-slate-700">订单</span>
                    </button>
                    <button onclick="openShortCenter()" id="entry-short" class="flex flex-col items-center gap-1 py-1.5 active-scale">
                        <div class="w-10 h-10 rounded-full bg-indigo-50 flex items-center justify-center text-lg">📱</div>
                        <span class="text-[10px] font-bold text-slate-700">短号</span>
                    </button>
                    <button onclick="switchTab('codes')" class="flex flex-col items-center gap-1 py-1.5 active-scale">
                        <div class="w-10 h-10 rounded-full bg-emerald-50 flex items-center justify-center text-lg">🎫</div>
                        <span class="text-[10px] font-bold text-slate-700">持有码</span>
                    </button>
                    <button onclick="switchTab('resale')" id="entry-resale" class="flex flex-col items-center gap-1 py-1.5 active-scale">
                        <div class="w-10 h-10 rounded-full bg-purple-50 flex items-center justify-center text-lg">🛒</div>
                        <span class="text-[10px] font-bold text-slate-700">流转市场</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- 热门商品 -->
        <div class="px-4 mt-4">
            <div class="flex items-center justify-between mb-2">
                <div class="text-sm font-bold text-slate-900">🔥 热门商品</div>
            </div>
            <div id="hot-products" class="flex gap-2 overflow-x-auto hide-scrollbar pb-2"></div>
        </div>

        <!-- 分类切换 -->
        <div class="px-4 mt-4">
            <div class="flex gap-2 mb-3">
                <button onclick="switchCategory('all')" id="cat-all" class="tab-btn active text-xs font-bold text-slate-600 px-3 py-1.5">全部</button>
                <button onclick="switchCategory('physical')" id="cat-physical" class="tab-btn text-xs font-bold text-slate-600 px-3 py-1.5">实物</button>
                <button onclick="switchCategory('virtual')" id="cat-virtual" class="tab-btn text-xs font-bold text-slate-600 px-3 py-1.5">虚拟</button>
                <button onclick="switchCategory('service')" id="cat-service" class="tab-btn text-xs font-bold text-slate-600 px-3 py-1.5">服务</button>
            </div>
            <div id="product-grid" class="grid grid-cols-2 gap-2"></div>
        </div>

        <div class="h-6"></div>
    </div>

    <!-- ========== view-detail 商品详情 ========== -->
    <div id="view-detail" class="view" style="position:absolute; top:44px; left:0; right:0; bottom:0; overflow-y:auto; z-index:20; background:white;"></div>

    <!-- ========== view-search 搜索 ========== -->
    <div id="view-search" class="view" style="position:absolute; top:44px; left:0; right:0; bottom:0; z-index:20; background:white;"></div>

    <!-- ========== view-checkout 结算 ========== -->
    <div id="view-checkout" class="view" style="position:absolute; top:44px; left:0; right:0; bottom:0; overflow-y:auto; z-index:30; background:#f5f6f8;"></div>

    <!-- ========== view-pin PIN 验签 ========== -->
    <div id="view-pin" class="view" style="position:absolute; top:0; left:0; right:0; bottom:0; z-index:55; background:rgba(15,23,42,0.85); backdrop-filter:blur(10px); display:none; align-items:center; justify-content:center;">
        <div class="bg-white rounded-2xl p-6 mx-6 w-full">
            <div class="text-center mb-4">
                <div class="text-2xl mb-2">🔐</div>
                <div class="text-base font-bold text-slate-900">输入 PIN 码</div>
                <div class="text-[11px] text-slate-500 mt-1">确认下单并触发链上交易</div>
            </div>
            <div class="flex gap-2 justify-center mb-4">
                <input id="pin-1" class="pin-input" maxlength="1" oninput="movePin(this, 1)" />
                <input id="pin-2" class="pin-input" maxlength="1" oninput="movePin(this, 2)" />
                <input id="pin-3" class="pin-input" maxlength="1" oninput="movePin(this, 3)" />
                <input id="pin-4" class="pin-input" maxlength="1" oninput="movePin(this, 4)" />
                <input id="pin-5" class="pin-input" maxlength="1" oninput="movePin(this, 5)" />
                <input id="pin-6" class="pin-input" maxlength="1" oninput="movePin(this, 6)" />
            </div>
            <button onclick="confirmPin()" class="btn-primary w-full">确认下单</button>
            <button onclick="closePinModal()" class="btn-secondary w-full mt-2">取消</button>
        </div>
    </div>

    <!-- ========== view-result 下单结果 ========== -->
    <div id="view-result" class="view" style="position:absolute; top:44px; left:0; right:0; bottom:0; overflow-y:auto; z-index:50; background:white;"></div>

    <!-- ========== view-orders 订单管理 ========== -->
    <div id="view-orders" class="view" style="position:absolute; top:44px; left:0; right:0; bottom:0; overflow-y:auto; z-index:40; background:#f5f6f8;"></div>

    <!-- ========== view-return 退货申请 ========== -->
    <div id="view-return" class="view" style="position:absolute; top:44px; left:0; right:0; bottom:0; overflow-y:auto; z-index:45; background:#f5f6f8;"></div>

    <!-- ========== view-order-detail 订单详情 ========== -->
    <div id="view-order-detail" class="view" style="position:absolute; top:44px; left:0; right:0; bottom:0; overflow-y:auto; z-index:46; background:#f5f6f8;"></div>

    <!-- ========== view-my-codes 持有码 ========== -->
    <div id="view-my-codes" class="view" style="position:absolute; top:44px; left:0; right:0; bottom:0; overflow-y:auto; z-index:45; background:#f5f6f8;"></div>

    <!-- ========== view-code-history 持有码流转历史 ========== -->
    <div id="view-code-history" class="view" style="position:absolute; top:44px; left:0; right:0; bottom:0; overflow-y:auto; z-index:46; background:#f5f6f8;"></div>

    <!-- ========== view-resale 流转市场 ========== -->
    <div id="view-resale" class="view" style="position:absolute; top:44px; left:0; right:0; bottom:0; overflow-y:auto; z-index:45; background:#f5f6f8;"></div>

    <!-- ========== view-list-item 挂单表单 ========== -->
    <div id="view-list-item" class="view" style="position:absolute; top:44px; left:0; right:0; bottom:0; overflow-y:auto; z-index:46; background:#f5f6f8;"></div>

    <!-- ========== view-transfer-item 转赠表单 ========== -->
    <div id="view-transfer-item" class="view" style="position:absolute; top:44px; left:0; right:0; bottom:0; overflow-y:auto; z-index:46; background:#f5f6f8;"></div>

    <!-- ========== view-buy-listed 购买确认弹窗（底部抽屉） ========== -->
    <div id="view-buy-listed" class="view" style="position:absolute; top:0; left:0; right:0; bottom:0; z-index:55; background:rgba(15,23,42,0.85); backdrop-filter:blur(10px); display:none; align-items:flex-end; justify-content:center;">
        <div class="bg-white rounded-t-2xl p-5 w-full max-w-md" id="buy-listed-body"></div>
    </div>

    <!-- ========== view-cancel-listing 撤单确认弹窗（底部抽屉） ========== -->
    <div id="view-cancel-listing" class="view" style="position:absolute; top:0; left:0; right:0; bottom:0; z-index:55; background:rgba(15,23,42,0.85); backdrop-filter:blur(10px); display:none; align-items:flex-end; justify-content:center;">
        <div class="bg-white rounded-t-2xl p-5 w-full max-w-md" id="cancel-listing-body"></div>
    </div>

    <!-- ========== view-short-center 短号中心 ========== -->
    <div id="view-short-center" class="view" style="position:absolute; top:44px; left:0; right:0; bottom:0; overflow-y:auto; z-index:45; background:#f5f6f8;"></div>

    <!-- ========== view-short-pay 短号支付弹窗 ========== -->
    <div id="view-short-pay" class="view" style="position:absolute; top:0; left:0; right:0; bottom:0; z-index:55; background:rgba(15,23,42,0.85); backdrop-filter:blur(10px); display:none; align-items:flex-end; justify-content:center;">
        <div class="bg-white rounded-t-2xl p-5 w-full max-w-md" id="short-pay-body"></div>
    </div>

    <!-- ========== view-short-transfer 短号转移弹窗（底部抽屉） ========== -->
    <div id="view-short-transfer" class="view" style="position:absolute; top:0; left:0; right:0; bottom:0; z-index:55; background:rgba(15,23,42,0.85); backdrop-filter:blur(10px); display:none; align-items:flex-end; justify-content:center;">
        <div class="bg-white rounded-t-2xl p-5 w-full max-w-md" id="short-transfer-body"></div>
    </div>

// ---------- 视图切换 ----------
function openView(id) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}
function closeView(id) {
    document.getElementById(id).classList.remove('active');
}

function switchTab(tab) {
    if (tab === 'mall') openView('view-mall');
    else if (tab === 'orders') openOrders();
    else if (tab === 'codes') openMyCodes();
    else if (tab === 'resale') openResale();
}

// ---------- Toast ----------
function showToast(message, icon = 'ℹ️') {
    const toast = document.getElementById('toast');
    toast.querySelector('div').textContent = `${icon} ${message}`;
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 2500);
}

// ---------- 角色切换 ----------
function switchRole(role) {
    const roleDef = ROLES[role];
    if (!roleDef) return;

    userState.role = role;
    userState.rank = roleDef.rank;
    userState.referrerOf = roleDef.referrerOf;
    userState.upline = roleDef.upline;

    document.querySelectorAll('.role-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById(`role-btn-${role}`).classList.add('active');

    renderRoleDetail();

    showToast(`已切换为「${roleDef.label}」视图`, '👤');
}

function renderRoleDetail() {
    const detail = document.getElementById('role-detail');
    const role = ROLES[userState.role];

    let html = `
        <div class="bg-slate-50 rounded-lg p-2.5 mb-2">
            <div class="flex items-center justify-between mb-1">
                <div class="flex items-center gap-1.5">
                    <span class="text-lg">${role.emoji}</span>
                    <span class="text-xs font-bold text-slate-900">${role.label}</span>
                </div>
                ${userState.rank > 0 ? `<span class="rank-pill text-[10px] px-1.5 py-0.5 rounded">rank ${userState.rank}</span>` : ''}
            </div>
            <div class="text-[10px] text-slate-500 leading-relaxed">${role.desc}</div>
            ${userState.shortCode ? `<div class="text-[10px] text-slate-400 mt-1">短号: ${userState.shortCode}</div>` : ''}
        </div>
    `;

    // rank 滑块（仅 agent）
    if (userState.role === 'agent') {
        html += `
            <div class="bg-amber-50 rounded-lg p-2.5 mb-2">
                <div class="flex items-center justify-between mb-1.5">
                    <span class="text-[10px] font-bold text-slate-700">我的 rank 滑块</span>
                    <span class="text-xs font-mono font-bold text-amber-600">L${userState.rank}</span>
                </div>
                <input type="range" min="1" max="10" value="${userState.rank}" oninput="updateRank(this.value)" class="w-full" style="accent-color: #f59e0b;" />
                <div class="text-[9px] text-slate-400 mt-1">仅影响自身 rank，不影响上线链各层 rank</div>
            </div>
        `;
    }

    // 双视角标识
    if (userState.role === 'agent' || userState.role === 'buyer') {
        html += `
            <div class="flex gap-1.5 mb-2">
                <div class="flex-1 bg-blue-50 rounded-md py-1 text-center">
                    <div class="text-[9px] text-blue-600 font-bold">🛒 购买视角</div>
                    <div class="text-[9px] text-blue-400">我买东西上线赚</div>
                </div>
                <div class="flex-1 bg-emerald-50 rounded-md py-1 text-center">
                    <div class="text-[9px] text-emerald-600 font-bold">💰 上线视角</div>
                    <div class="text-[9px] text-emerald-400">别人买我赚</div>
                </div>
            </div>
        `;
    }

    // 上线链（仅 buyer/agent）
    if (userState.upline && userState.upline.length > 0) {
        html += `<div class="bg-white border border-slate-200 rounded-lg p-2 mb-2"><div class="text-[9px] font-bold text-slate-500 mb-1">上线链（各层 rank 独立）</div>`;
        userState.upline.forEach((u, i) => {
            const opacity = i === 0 ? 'opacity-100' : (i === 1 ? 'opacity-60' : 'opacity-40');
            const rankBadge = u.rank >= 1 ? `<span class="rank-pill text-[9px] px-1 py-0.5 rounded">L${u.rank}</span>` : `<span class="text-[9px] text-slate-400">L0</span>`;
            const status = u.rank >= 1 ? '✅ 合格' : '❌ 跳过(compression)';
            html += `
                <div class="flex items-center justify-between py-1 ${opacity}">
                    <div class="flex items-center gap-1.5">
                        <span class="text-[10px] text-slate-400">L${u.layer}</span>
                        <span class="text-[10px] font-bold text-slate-700">${u.name}</span>
                        <span class="text-[9px] text-slate-400">#${u.shortCode}</span>
                    </div>
                    <div class="flex items-center gap-1">${rankBadge}<span class="text-[9px] ${u.rank >= 1 ? 'text-emerald-600' : 'text-slate-400'}">${status}</span></div>
                </div>
            `;
        });
        html += `</div>`;
    }

    // 购买视角示例（100U 商品）
    if (userState.role === 'buyer' || userState.role === 'agent') {
        const preview = mockPreviewRebate(null, 100);
        html += `
            <div class="bg-blue-50 rounded-lg p-2 mb-2">
                <div class="text-[9px] font-bold text-blue-600 mb-1">🛒 购买视角：我买 100U 商品</div>
                ${preview.map(p => `
                    <div class="flex items-center justify-between py-0.5">
                        <span class="text-[10px] text-slate-600">L${p.layer} ${p.name} ${p.rank >= 1 ? `(L${p.rank})` : '(L0)'}</span>
                        <span class="text-[10px] font-mono ${p.skip ? 'text-slate-400 line-through' : 'text-emerald-600 font-bold'}">${p.skip ? '跳过' : `+${p.amount.toFixed(2)}U`}</span>
                    </div>
                `).join('')}
                <div class="text-[9px] text-blue-500 mt-1 pt-1 border-t border-blue-200">上线总赚: ${preview.reduce((s, p) => s + (p.skip ? 0 : p.amount), 0).toFixed(2)}U</div>
            </div>
        `;
    }

    // 上线视角（仅 agent）
    if (userState.role === 'agent') {
        const myBps = REBATE_MATRIX[userState.rank][1];
        const earn = 100 * myBps;
        html += `
            <div class="bg-emerald-50 rounded-lg p-2 mb-2">
                <div class="text-[9px] font-bold text-emerald-600 mb-1">💰 上线视角：下级买 100U 我赚</div>
                <div class="flex items-center justify-between py-0.5">
                    <span class="text-[10px] text-slate-600">作为 L1 直接上线</span>
                    <span class="text-[10px] font-mono text-emerald-600 font-bold">+${earn.toFixed(2)}U</span>
                </div>
                <div class="text-[9px] text-emerald-400 mt-1">按 rank ${userState.rank} 的 L1 比例 ${(myBps * 100).toFixed(1)}%</div>
            </div>
        `;
    }

    // 游客归因提示
    if (userState.role === 'guest') {
        html += `
            <div class="bg-amber-50 rounded-lg p-2 mb-2">
                <div class="text-[9px] font-bold text-amber-600 mb-1">🚶 游客购买提示</div>

                <div class="text-[10px] text-slate-500 mt-0.5">本次购买无上线分润（未绑定 E 链）</div>
            </div>
        `;
    }

    detail.innerHTML = html;
}

function updateRank(val) {
    userState.rank = parseInt(val);
    renderRoleDetail();
    if (document.getElementById('view-detail').classList.contains('active') && userState.currentProduct) {
        renderDetail(userState.currentProduct.id);
    }
    if (document.getElementById('view-checkout').classList.contains('active')) {
        renderCheckout();
    }
}

function toggleRoleFloat() {
    const float = document.getElementById('role-float');
    const mini = document.getElementById('role-float-mini');
    if (float.style.display !== 'none') {
        float.style.display = 'none';
        mini.style.display = 'flex';
    } else {
        float.style.display = 'block';
        mini.style.display = 'none';
    }
}

// 模拟合约 previewRebate（对齐 AgentReward.sol）
// 从 buyer 上线链取 N 层，compression 跳过 rank=0
function mockPreviewRebate(buyer, base) {
    const upline = userState.upline || [];
    const rebateLayers = 3;
    const result = [];

    for (let layer = 1; layer <= rebateLayers; layer++) {
        const uplineAtLayer = upline[layer - 1];
        if (!uplineAtLayer) break;

        if (uplineAtLayer.rank >= 1) {
            const bps = REBATE_MATRIX[uplineAtLayer.rank][layer];
            result.push({
                layer,
                name: uplineAtLayer.name,
                rank: uplineAtLayer.rank,
                amount: base * bps,
                skip: false,
            });
        } else {
            result.push({
                layer,
                name: uplineAtLayer.name,
                rank: 0,
                amount: 0,
                skip: true,
            });
        }
    }

    return result;
}

            <div class="text-xs font-mono text-brand font-bold">${p.prices.USDR} <span class="text-[9px]">USDR</span></div>

}

function renderProductGrid(category = 'all') {
    const container = document.getElementById('product-grid');
    const list = category === 'all' ? PRODUCTS : PRODUCTS.filter(p => p.category === category);
    container.innerHTML = list.map(p => {
        const stockPercent = (p.sold / (p.stock + p.sold)) * 100;
        const lowStock = p.stock < 50;
        return `
            <div onclick="openProductDetail(${p.id})" class="bg-white rounded-xl p-2 card-shadow active-scale cursor-pointer">
                <div class="w-full h-24 product-img-fade rounded-lg flex items-center justify-center text-3xl mb-1.5 relative">
                    ${p.emoji}
                    ${p.secretCode ? '<span class="absolute top-1 right-1 badge-p1">保密</span>' : ''}
                    ${p.stock === 0 ? '<span class="absolute top-1 left-1 tag-stockout text-[9px] px-1.5 py-0.5 rounded">缺货</span>' : ''}
                </div>
                <div class="text-xs font-bold text-slate-900 line-clamp-1">${p.name}</div>
                <div class="text-[10px] text-slate-400 mb-1">${p.category === 'physical' ? '实物' : p.category === 'virtual' ? '虚拟' : '服务'}</div>
                <div class="flex items-center justify-between">
                    <span class="text-xs font-mono text-brand font-bold">${p.prices.USDR}</span>
                    <span class="text-[9px] text-slate-400">USDR</span>
                </div>
                ${p.rewards.length > 0 ? `<div class="text-[9px] text-emerald-600 mt-0.5">🎁 ${p.rewards[0].desc}</div>` : ''}

}

// ---------- 商品详情 ----------
function openProductDetail(id) {
    userState.currentProduct = PRODUCTS.find(p => p.id === id);
    if (!userState.currentProduct) return;
    renderDetail(id);
    openView('view-detail');
}

function renderDetail(id) {
    const p = PRODUCTS.find(x => x.id === id);
    if (!p) return;
    userState.currentProduct = p;
    const view = document.getElementById('view-detail');

    const tiers = p.tiers.map(t => `<div class="text-[10px] text-slate-600">满 ${t.minQty} 件 → ${(t.bps / 100).toFixed(0)}% 折扣</div>`).join('');
    const rewards = p.rewards.map(r => `<div class="text-[10px] text-emerald-600">🎁 ${r.desc}</div>`).join('');

    // 按合约字段动态生成属性行（仅展示真实有值的字段）
    // 库存：仅实物/保密商品（服务类/积分包类无限量）
    const showStock = p.category === 'physical' || p.secretCode;
    // 积分/件：仅 pointsPerUnit > 0
    const showPoints = p.pointsPerUnit > 0;
    // 喂团队：仅 feedTeamPoints === true
    const showFeedTeam = p.feedTeamPoints === true;
    // 流转费：仅 resaleFeeBps > 0
    const showResaleFee = p.resaleFeeBps > 0;

    const stockRow = showStock ? `<div><div class="text-[10px] text-slate-400">库存</div><div class="text-sm font-bold text-slate-900">${p.stock}</div></div>` : '';
    const soldRow = `<div><div class="text-[10px] text-slate-400">已售</div><div class="text-sm font-bold text-slate-900">${p.sold}</div></div>`;
    const minOrderRow = `<div><div class="text-[10px] text-slate-400">起订量</div><div class="text-sm font-bold text-slate-900">${p.minOrderQty}</div></div>`;
    const pointsRow = showPoints ? `<div><div class="text-[10px] text-slate-400">积分/件</div><div class="text-sm font-bold text-slate-900">${p.pointsPerUnit}</div></div>` : '';
    const feedTeamRow = showFeedTeam ? `<div><div class="text-[10px] text-slate-400">喂团队</div><div class="text-sm font-bold text-emerald-600">✓</div></div>` : '';
    const resaleFeeRow = showResaleFee ? `<div><div class="text-[10px] text-slate-400">流转费</div><div class="text-sm font-bold text-slate-900">${(p.resaleFeeBps / 100).toFixed(0)}%</div></div>` : '';

    // 第一行：库存/已售/起订量（库存按条件展示）
    const row1 = [stockRow, soldRow, minOrderRow].filter(Boolean).join('');
    // 第二行：积分/喂团队/流转费（按条件展示，全为空则不渲染第二行）
    const row2 = [pointsRow, feedTeamRow, resaleFeeRow].filter(Boolean).join('');

    view.innerHTML = `
        <div class="relative">
            <div class="w-full h-56 product-img-fade flex items-center justify-center text-7xl">${p.emoji}</div>
            <button onclick="openView('view-mall')" class="absolute top-3 left-3 w-9 h-9 rounded-full bg-white bg-opacity-90 flex items-center justify-center shadow">←</button>
            ${p.secretCode ? '<div class="absolute top-3 right-3 badge-p1">保密商品</div>' : ''}
        </div>
        <div class="p-4">
            <div class="text-lg font-bold text-slate-900 mb-1">${p.name}</div>
            <div class="text-xs text-slate-500 mb-3">${p.desc}</div>

            <div class="bg-white rounded-xl p-3 card-shadow mb-3">
                <div class="flex items-baseline gap-1 mb-2">
                    <span class="text-2xl font-mono font-bold text-brand">${p.prices.USDR}</span>
                    <span class="text-xs text-slate-400">USDR</span>
                    <span class="text-[10px] text-slate-400 ml-2">/ ${p.prices.USDT} USDT</span>
                </div>
                <div class="text-[10px] text-slate-500 mb-1">阶梯折扣（按数量）</div>
                ${tiers}
            </div>

            ${rewards ? `
                <div class="bg-emerald-50 rounded-xl p-3 mb-3">
                    <div class="text-[10px] font-bold text-emerald-700 mb-1">🎁 直写奖励</div>
                    ${rewards}
                    <div class="text-[9px] text-emerald-500 mt-1">⚠️ 直写奖励失败会导致整单 revert（无 try/catch）</div>
                </div>
            ` : ''}

            ${p.secretCode ? `
                <div class="alert-p1 rounded-xl p-3 mb-3">
                    <div class="text-[10px] font-bold text-amber-700 mb-1">⚠️ 保密商品说明</div>
                    <div class="text-[10px] text-slate-600">购买后通过链下 API 凭 refId 领取真实卡密。链上仅存哈希，攻击者扫描 calldata 无法还原真实码体。</div>
                </div>
            ` : ''}

            ${row1 ? `
                <div class="bg-white rounded-xl p-3 card-shadow mb-3">
                    <div class="grid grid-cols-3 gap-2 text-center">
                        ${row1}
                    </div>
                    ${row2 ? `

            <button onclick="openCheckout()" class="btn-primary w-full">立即购买</button>
            <div class="h-4"></div>
        </div>
    `;
}

// ---------- 结算 ----------
function openCheckout() {
    if (!userState.currentProduct) return;
    renderCheckout();
    openView('view-checkout');
}

function renderCheckout() {
    const p = userState.currentProduct;
    const qty = userState.currentOrderQty || 1;
    const payToken = userState.currentPayToken || 'USDR';
    const unit = p.prices[payToken];

    // 阶梯折扣（对齐 _tierBps 算法：默认 10000，找最高 minQty 那档）
    let tierBps = 10000;
    let bestMin = 0;
    for (const t of p.tiers) {
        if (qty >= t.minQty && t.minQty >= bestMin) {
            bestMin = t.minQty;
            tierBps = t.bps;
        }
    }

    const gross = unit * qty;
    const net = gross * tierBps / 10000;

    // 直写奖励预览
    let directRewardTotal = 0;
    const directRewardsHtml = p.rewards.map((r, i) => {
        let amt = 0;
        if (r.mode === 0) amt = r.amountOrBps * qty;
        else amt = net * r.amountOrBps / 10000;
        directRewardTotal += amt;
        return `<div class="flex items-center justify-between py-0.5"><span class="text-[10px] text-slate-600">${r.desc}</span><span class="text-[10px] font-mono text-emerald-600 font-bold">+${amt.toFixed(2)} ${payToken}</span></div>`;
    }).join('');

    // 是否实物商品（需要收货地址）
    const isPhysical = p.category === 'physical';
    // 当前选中地址
    const selectedAddr = userState.selectedAddressId ? MY_ADDRESSES.find(a => a.id === userState.selectedAddressId) : MY_ADDRESSES.find(a => a.isDefault);

    // 批量定购快捷档位（复用商品 tiers 数据）
    const tiersHtml = p.tiers.map(t => {
        const isActive = qty >= t.minQty && tierBps === t.bps;
        const saved = t.bps < 10000 ? `省 ${((10000 - t.bps) / 100).toFixed(0)}%` : '原价';
        return `<button onclick="applyTier(${t.minQty})" class="flex-shrink-0 px-3 py-2 rounded-lg text-xs font-bold border ${isActive ? 'gradient-brand text-white border-transparent' : 'bg-white text-slate-600 border-slate-200'}">
            <div>${t.minQty}件</div>
            <div class="text-[9px] ${isActive ? 'opacity-90' : 'text-slate-400'}">${(t.bps / 100).toFixed(0)}%价 · ${saved}</div>
        </button>`;
    }).join('');

    // 钱包调用明细
    const walletShort = userState.walletAddr.slice(0, 8) + '...' + userState.walletAddr.slice(-4);
    const balance = payToken === 'USDR' ? userState.usdrBalance : userState.usdtBalance;
    const walletCallHtml = `
        <div class="bg-white rounded-xl p-3 card-shadow mb-3">
            <div class="flex items-center justify-between mb-2">
                <span class="text-[10px] font-bold text-slate-700">📋 链上调用预览</span>

                <div class="bg-slate-50 rounded-lg p-2">
                    <div class="text-[10px] text-slate-600"><span class="font-mono font-bold text-slate-800">①</span> approve(${payToken}, GoodsMarket, ${net.toFixed(2)})</div>
                    <div class="text-[9px] text-slate-400 pl-4">授权合约扣款</div>
                </div>
                <div class="bg-slate-50 rounded-lg p-2">
                    <div class="text-[10px] text-slate-600"><span class="font-mono font-bold text-slate-800">②</span> GoodsMarket.buy(${p.id}, ${qty}, ${payToken})</div>
                    <div class="text-[9px] text-slate-400 pl-4">触发购买 + 返利 hook（自动下发上线）</div>

                    <div class="flex items-center justify-between text-[10px]">
                        <span class="text-slate-500">调用钱包</span>

                    </div>
                    <div class="flex items-center justify-between text-[10px]">
                        <span class="text-slate-500">支付代币</span>
                        <span class="font-mono text-slate-700">${payToken} · 余额 ${balance}</span>
                    </div>
                    <div class="flex items-center justify-between text-[10px]">
                        <span class="text-slate-500">授权状态</span>
                        <span class="check-passed">✓ 已授权</span>
                    </div>
                    <div class="flex items-center justify-between text-[10px]">
                        <span class="text-slate-500">余额检查</span>
                        <span class="${balance >= net ? 'check-passed' : 'check-failed'}">${balance >= net ? '✓' : '❌'} ${balance} ${payToken}</span>
                    </div>
                </div>
                <div class="text-[9px] text-slate-400 pt-1">涉及合约: GoodsMarket / AgentReward / AgentPoints / AgentLevel</div>
            </div>
        </div>

        <div class="bg-white px-3 py-2 flex items-center gap-2 sticky top-0 z-10">

            <span class="text-[10px] text-slate-400 ml-auto truncate max-w-[120px]">${p.name}</span>
        </div>
        <div class="p-3">
            <!-- ② 商品概要卡 -->
            <div class="bg-white rounded-xl p-3 card-shadow mb-3">
                <div class="flex gap-3">
                    <div class="w-14 h-14 product-img-fade rounded-lg flex items-center justify-center text-2xl">${p.emoji}</div>
                    <div class="flex-1">
                        <div class="text-sm font-bold text-slate-900">${p.name}</div>
                        <div class="text-[10px] text-slate-400">${p.desc}</div>
                        <div class="text-xs font-mono text-brand font-bold mt-1">${unit} ${payToken}</div>
                    </div>
                </div>
            </div>

            <!-- ③ 批量定购快捷档位 -->
            ${p.tiers.length > 1 ? `
                <div class="bg-white rounded-xl p-3 card-shadow mb-3">
                    <div class="text-[10px] font-bold text-slate-700 mb-2">📦 批量定购快捷档位</div>
                    <div class="flex gap-2 overflow-x-auto hide-scrollbar pb-1">
                        ${tiersHtml}
                    </div>
                </div>
            ` : ''}

            <!-- ④ 数量精调 -->
            <div class="bg-white rounded-xl p-3 card-shadow mb-3">
                <div class="text-[10px] text-slate-500 mb-2">购买数量（起订 ${p.minOrderQty}）</div>
                <div class="flex items-center gap-3">
                    <button onclick="changeQty(-1)" class="w-8 h-8 rounded-full bg-slate-100 text-slate-600 font-bold">−</button>

                    <button onclick="changeQty(1)" class="w-8 h-8 rounded-full bg-slate-100 text-slate-600 font-bold">+</button>
                    <span class="ml-auto text-[10px] text-slate-400">阶梯：${tierBps === 10000 ? '原价' : `${(tierBps / 100).toFixed(0)}% 折扣`}</span>

            <!-- ⑤ 收货地址卡（仅实物商品） -->
            ${isPhysical ? `
                <div class="bg-white rounded-xl p-3 card-shadow mb-3">
                    <div class="flex items-center justify-between mb-2">

                    ${selectedAddr ? `
                        <div class="flex items-start gap-2">

            <div class="bg-white rounded-xl p-3 card-shadow mb-3">
                <div class="text-[10px] text-slate-500 mb-2">支付币种</div>
                <div class="flex gap-2">
                    ${Object.keys(p.prices).map(t => `
                        <button onclick="selectPayToken('${t}')" class="flex-1 py-2 rounded-lg text-xs font-bold ${payToken === t ? 'gradient-brand text-white' : 'bg-slate-100 text-slate-600'}">${t}</button>
                    `).join('')}
                </div>
                <div class="text-[10px] text-slate-400 mt-2">余额：${balance} ${payToken}</div>
            </div>

            <!-- ⑦ 价格明细 -->
            <div class="bg-white rounded-xl p-3 card-shadow mb-3">

// 批量定购：点击档位直接设为该档位 minQty
function applyTier(minQty) {
    const p = userState.currentProduct;
    if (minQty > p.stock && (p.category === 'physical' || p.secretCode)) {
        showToast('库存不足', '⚠️');
        return;
    }
    userState.currentOrderQty = minQty;
    renderCheckout();
}

// 折叠/展开调用明细
function toggleCallPreview() {
    const body = document.getElementById('call-preview-body');
    const toggle = document.getElementById('call-preview-toggle');
    if (body.style.display === 'none') {
        body.style.display = 'block';
        toggle.textContent = '收起';
    } else {
        body.style.display = 'none';
        toggle.textContent = '展开';
    }
}

function changeQty(delta) {
    const p = userState.currentProduct;
    let qty = (userState.currentOrderQty || 1) + delta;
    if (qty < p.minOrderQty) qty = p.minOrderQty;
    // 仅实物/保密商品有库存上限
    if ((p.category === 'physical' || p.secretCode) && qty > p.stock) {
        showToast('库存不足', '⚠️');
        return;
    }
    userState.currentOrderQty = qty;
    renderCheckout();
}

function selectPayToken(token) {
    userState.currentPayToken = token;
    renderCheckout();
}

// ---------- PIN 验签 ----------
function openPinModal() {
    document.getElementById('view-pin').style.display = 'flex';
    for (let i = 1; i <= 6; i++) document.getElementById(`pin-${i}`).value = '';
    setTimeout(() => document.getElementById('pin-1').focus(), 100);
}

function closePinModal() {
    document.getElementById('view-pin').style.display = 'none';
}

function movePin(input, idx) {
    if (input.value && idx < 6) {
        document.getElementById(`pin-${idx + 1}`).focus();
    }
}

function confirmPin() {
    let pin = '';
    for (let i = 1; i <= 6; i++) pin += document.getElementById(`pin-${i}`).value;
    if (pin.length !== 6) {
        showToast('请输入 6 位 PIN 码', '⚠️');
        return;
    }
    closePinModal();
    processOrder();
}

function processOrder() {
    const p = userState.currentProduct;
    const qty = userState.currentOrderQty || 1;
    const payToken = userState.currentPayToken || 'USDR';
    const unit = p.prices[payToken];

    let tierBps = 10000;
    let bestMin = 0;
    for (const t of p.tiers) {
        if (qty >= t.minQty && t.minQty >= bestMin) { bestMin = t.minQty; tierBps = t.bps; }
    }
    const gross = unit * qty;
    const net = gross * tierBps / 10000;

    // 模拟订单处理
    const refId = '0xorder' + Date.now().toString(16);

    // 模拟直写奖励失败概率（演示 P0 风险）
    const directRewardFail = p.rewards.length > 0 && Math.random() < 0.05;

    const view = document.getElementById('view-result');
    view.innerHTML = `
        <div class="p-4">
            <div class="text-center py-8">
                <div class="text-5xl mb-3">✅</div>
                <div class="text-lg font-bold text-slate-900">下单成功</div>
                <div class="text-xs text-slate-400 mt-1">订单号: ${refId.slice(0, 18)}...</div>
            </div>

            <div class="bg-white rounded-xl p-3 card-shadow mb-3">

// ---------- 订单管理 ----------
// 用户可见状态派生（对齐《交易订单状态设计方案》§五）
// 主状态 4 态：created / return_requested / returned / return_rejected
// 辅助态：实物 fulfillmentStatus（pending_shipment/shipped/delivered）
//        虚拟 redeemStatus（pending_redeem/redeemed）
function getUserStatus(order) {
    // 1. 先判主状态
    if (order.status === 'returned') return { key: 'returned', label: '已退货', badge: 'badge-returned' };
    if (order.status === 'return_requested') return { key: 'return_requested', label: '退货申请中', badge: 'badge-returning' };
    if (order.status === 'return_rejected') return { key: 'return_rejected', label: '退货被拒', badge: 'badge-rejected' };

    // 2. 主状态为 created 时，按商品类型看辅助态
    if (order.status === 'created') {
        if (order.orderType === 'physical') {
            const fs = order.fulfillmentStatus;
            if (fs === 'pending_shipment') return { key: 'pending_shipment', label: '待发货', badge: 'badge-pending' };
            if (fs === 'shipped') return { key: 'shipped', label: '已发货', badge: 'badge-shipped' };
            if (fs === 'delivered') return { key: 'completed', label: '已完成', badge: 'badge-completed' };
            return { key: 'pending_shipment', label: '待发货', badge: 'badge-pending' };
        }
        if (order.orderType === 'virtual') {
            return order.redeemStatus === 'redeemed'
                ? { key: 'completed', label: '已完成', badge: 'badge-completed' }
                : { key: 'pending_redeem', label: '待领取', badge: 'badge-pending' };
        }
        // 服务/积分：buy() 即时完成，无辅助态
        return { key: 'completed', label: '已完成', badge: 'badge-completed' };
    }
    return { key: 'unknown', label: '未知', badge: 'badge-returned' };
}

// Tab 筛选条件（对齐方案§八：全部/进行中/已完成/退货）
// 分类语义互斥：交易进行中 / 交易完结 / 退货流程
// "进行中" = 待发货 + 待领取 + 已发货（交易流程未完结，需用户推进）
// "已完成" = 已完成（交易流程完结）
// "退货"   = 退货申请中 + 已退货 + 退货被拒（退货相关全流程）
function filterOrderByTab(type) {
    if (type === 'all') return MY_PURCHASES;
    if (type === 'pending') {
        return MY_PURCHASES.filter(o => {
            const s = getUserStatus(o).key;
            return ['pending_shipment', 'pending_redeem', 'shipped'].includes(s);
        });
    }
    if (type === 'completed') return MY_PURCHASES.filter(o => getUserStatus(o).key === 'completed');
    if (type === 'returned') return MY_PURCHASES.filter(o => ['return_requested', 'returned', 'return_rejected'].includes(getUserStatus(o).key));
    return MY_PURCHASES;
}

// 订单卡片操作按钮（对齐方案§七）
function orderCardButtons(o) {
    const s = getUserStatus(o).key;
    let btns = `<button onclick="openOrderDetail('${o.refId}')" class="btn-secondary flex-1 text-xs py-2">查看详情</button>`;
    if (s === 'shipped') {
        btns += `<button onclick="confirmReceive('${o.refId}')" class="btn-primary flex-1 text-xs py-2">确认收货</button>`;
    }
    if (s === 'pending_redeem') {
        btns += `<button onclick="redeemCode('${o.refId}')" class="btn-primary flex-1 text-xs py-2">领取卡密</button>`;
    }
    if (s === 'completed' && o.orderType === 'virtual') {
        btns += `<button onclick="openCodeDetail('${o.codeIds[0]}')" class="btn-secondary text-xs py-2 px-3">查看卡密</button>`;
    }
    // 可申请退货：created 下的任意辅助态 + return_rejected（可重新申请）
    if (['pending_shipment', 'shipped', 'completed', 'return_rejected', 'pending_redeem'].includes(s)) {
        if (s === 'return_rejected') {
            btns += `<button onclick="openReturn('${o.refId}')" class="btn-secondary text-xs py-2 px-3">重新申请</button>`;
        } else {
            btns += `<button onclick="openReturn('${o.refId}')" class="btn-secondary text-xs py-2 px-3">申请退货</button>`;
        }
    }
    // 退货申请中：可撤销
    if (s === 'return_requested') {
        btns += `<button onclick="cancelReturn('${o.refId}')" class="btn-danger text-xs py-2 px-3">撤销申请</button>`;
    }
    return btns;
}

// 确认收货（对齐方案§10.2：只改辅助态 fulfillmentStatus=delivered，主状态仍为 created）
function confirmReceive(refId) {
    const o = MY_PURCHASES.find(x => x.refId === refId);
    if (!o) return;
    o.fulfillmentStatus = 'delivered';
    o.shipping.status = 'delivered';
    o.timeline.push({ time: new Date().toISOString().slice(0,16).replace('T',' '), event: '用户确认收货' });
    showToast('已确认收货', '✅');
    openOrderDetail(refId);
}

// 领取卡密（对齐方案§10.3：标记 redeemStatus=redeemed，主状态仍为 created）
function redeemCode(refId) {
    const o = MY_PURCHASES.find(x => x.refId === refId);
    if (!o) return;
    o.redeemStatus = 'redeemed';
    o.timeline.push({ time: new Date().toISOString().slice(0,16).replace('T',' '), event: '卡密已领取' });
    showToast('卡密已领取', '✅');
    // 展示卡密
    if (o.codeIds && o.codeIds.length > 0) openCodeDetail(o.codeIds[0]);
    else openOrderDetail(refId);
}

function copyText(text) {
    if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => showToast('已复制', '📋'));
    } else {
        showToast('请手动复制', '📋');
    }
}

// ---------- 退货相关函数 ----------
// 撤销退货申请（对齐方案§七：退货申请中→撤销申请，调链下撤销）
function cancelReturn(refId) {
    const o = MY_PURCHASES.find(x => x.refId === refId);
    if (!o || o.status !== 'return_requested') return;
    if (!confirm('确认撤销退货申请？撤销后将恢复订单原状态。')) return;
    o.status = 'created';                // 主状态回退到 created
    o.returnRequest = null;              // 清空退货申请
    o.timeline.push({ time: new Date().toISOString().slice(0,16).replace('T',' '), event: '退货申请已撤销' });
    showToast('退货申请已撤销', '✅');
    openOrderDetail(refId);
}

// 查看退货驳回原因（对齐方案§七：退货被拒→查看原因）
function viewReturnReason(refId) {
    const o = MY_PURCHASES.find(x => x.refId === refId);
    if (!o || !o.returnRequest) return;
    showToast(`驳回原因：${o.returnRequest.rejectReason || '未提供'}`, '❌');
}

// ---------- 退货申请（含 P0 漏洞 1 防护）----------
function openReturn(refId) {
    const order = MY_PURCHASES.find(o => o.refId === refId);
    if (!order) return;

    const view = document.getElementById('view-return');
    const directRewards = order.directRewards || [];

}

function returnDirectReward(orderRefId, index) {
    const order = MY_PURCHASES.find(o => o.refId === orderRefId);
    const dr = order.directRewards[index];
    dr.returnedAmount = dr.amount;
    showToast('直写奖励已退回', '✓');
    openReturn(orderRefId);
}

function revokeDirectReward(orderRefId, index) {
    const order = MY_PURCHASES.find(o => o.refId === orderRefId);
    const dr = order.directRewards[index];
    dr.revoked = true;
    showToast('直写奖励已撤销', '✓');
    openReturn(orderRefId);
}

// 提交退货申请（对齐方案§二：主状态 created/return_rejected → return_requested）
// 合约层：调用 returnRequest 触发 ReturnRequested 事件，主状态变为 return_requested
function submitReturn(refId) {
    const o = MY_PURCHASES.find(x => x.refId === refId);
    if (!o) return;
    // P0 校验：已领取未退回的直写奖励禁止提交
    const hasClaimedDirect = (o.directRewards || []).some(dr => dr.status === 'claimed' && dr.returnedAmount < dr.amount);
    if (hasClaimedDirect) {
        showToast('请先退回已领取的直写奖励', '❌');
        return;
    }
    // 主状态流转：created 或 return_rejected → return_requested
    o.status = 'return_requested';
    // 创建退货申请记录
    o.returnRequest = {
        codeId: (o.codeIds && o.codeIds[0]) || '',
        time: new Date().toISOString().slice(0,16).replace('T',' '),
        refundAmount: null,
        reason: '用户主动申请',
        open: true,
    };
    o.timeline.push({ time: o.returnRequest.time, event: '退货申请已提交（等待矿工审核）' });
    showToast('退货申请已提交，等待矿工审核', '✅');
    openOrderDetail(refId);
}

// 卡密领取流程（模拟链下 API 校验）
function redeemCode(codeId) {
    const code = MY_CODES.find(c => c.codeId === codeId);
    if (!code || !code.secretCode) { showToast('非保密商品无卡密', '⚠️'); return; }

    // 模拟链下 API 校验流程
    showToast('链下 API 校验中...', '⏳');
    setTimeout(() => {
        // 1. 调 orderCodes(refId) 拿到 codeId 列表，校验 codeId 在列表中
        // 2. 调 codeOwner(codeId) == buyer && codeStatus(codeId) == 2
        // 3. 查 db.secret_codes where codeHash == codeId 拿到 realCode
        code.realCode = 'ABCD-' + Math.random().toString(36).slice(2,6).toUpperCase() + '-EFGH-' + Date.now().toString().slice(-4);
        code.businessStatus = 'redeemed';
        showToast('卡密已领取（链下 API）', '✅');
        // 弹出一次性展示
        showRealCodeModal(code.realCode, code.realCodeExpiresAt);
        renderMyCodes();
    }, 1500);
}

// 靓号判定与定价
function analyzeNumberPattern(num) {
    const digits = num.split('').map(Number);
    const len = digits.length;
    const basePrice = Math.round(1000 * Math.pow(0.9, len - 5));

    // 豹子号：全部相同
    if (digits.every(d => d === digits[0])) return { type: '豹子号', multiplier: 50, price: basePrice * 50 };

    // 顺子号：严格递增或递减
    let isAsc = true, isDesc = true;
    for (let i = 1; i < digits.length; i++) {
        if (digits[i] !== digits[i-1] + 1) isAsc = false;
        if (digits[i] !== digits[i-1] - 1) isDesc = false;
    }
    if (isAsc || isDesc) return { type: '顺子号', multiplier: 20, price: basePrice * 20 };

    // 四连同
    for (let i = 0; i <= digits.length - 4; i++) {
        if (digits[i]===digits[i+1] && digits[i+1]===digits[i+2] && digits[i+2]===digits[i+3])
            return { type: '四连同', multiplier: 10, price: basePrice * 10 };
    }

    // 葫芦号：三连+对（频次 [3,2]）
    const freq = {};
    digits.forEach(d => freq[d] = (freq[d]||0)+1);
    const counts = Object.values(freq).sort((a,b)=>b-a);
    if (counts[0]===3 && counts[1]===2) return { type: '葫芦号', multiplier: 8, price: basePrice * 8 };

    // 双对子：至少两对
    const pairCount = counts.filter(c => c === 2).length;
    if (pairCount >= 2) return { type: '双对子', multiplier: 5, price: basePrice * 5 };

    // 吉尾号：尾数为 6/8/66/88
    const last = digits.slice(-1)[0];
    const last2 = digits.slice(-2);
    if ((last2.length===2 && last2[0]===6 && last2[1]===6) || (last2.length===2 && last2[0]===8 && last2[1]===8))
        return { type: '吉尾号', multiplier: 3, price: basePrice * 3 };
    if (last===6 || last===8) return { type: '吉尾号', multiplier: 3, price: basePrice * 3 };

    return { type: '普通号', multiplier: 1, price: basePrice };
}

function searchPremiumNumber() {
    const input = document.getElementById('premium-search-input');
    const val = input.value.trim();
    if (!/^\d{5,8}$/.test(val)) { showToast('请输入 5-8 位纯数字', '⚠️'); return; }
    const result = analyzeNumberPattern(val);
    const resultEl = document.getElementById('premium-search-result');
    const badgeClass = result.multiplier > 1 ? 'bg-amber-50 text-amber-700 border-amber-200' : 'bg-slate-50 text-slate-600 border-slate-200';
    resultEl.innerHTML = `

                <span class="text-sm font-bold font-mono">#${val}</span>

    `;
}

function triggerRandomNumbers() {
    const list = document.getElementById('premium-random-list');
    if (!list) return;
    const candidates = [];
    for (let i = 0; i < 8; i++) {
        let num = '';
        for (let j = 0; j < selectedDigitLength; j++) num += Math.floor(Math.random()*10);
        // 10% 豹子 / 10% 顺子 / 20% 吉尾 / 20% 双对子 / 40% 普通
        const r = Math.random();
        if (r < 0.1) { const d = Math.floor(Math.random()*10); num = String(d).repeat(selectedDigitLength); }
        else if (r < 0.2) { const start = Math.floor(Math.random()*(10-selectedDigitLength)); num = ''; for (let j=0;j<selectedDigitLength;j++) num += (start+j); }
        else if (r < 0.4) { num = num.slice(0,-1) + (Math.random()<0.5?'6':'8'); }
        const result = analyzeNumberPattern(num);
        candidates.push({ num, ...result });
    }
    list.innerHTML = candidates.map(c => {
        const isHot = c.multiplier >= 10;
        const badgeClass = c.multiplier > 1 ? 'bg-amber-50 text-amber-700 border-amber-200' : 'bg-slate-50 text-slate-600 border-slate-200';
        return `
            <div class="bg-slate-50 rounded-lg p-2 text-center ${isHot?'ring-1 ring-amber-300':''}">
                <div class="text-sm font-bold font-mono">#${c.num}</div>
                <span class="px-1 py-0.5 ${badgeClass} border rounded text-[8px] font-bold mt-1 inline-block">${c.type}</span>
                <div class="text-[10px] font-mono text-brand font-bold mt-1">${c.price} USDT</div>
                <button onclick="openShortPayModal('#${c.num}', '${c.type}', ${c.price})" class="mt-1 px-2 py-1 gradient-brand text-white text-[9px] font-bold rounded">购买</button>
            </div>
        `;
    }).join('');
}

function shortAddr(addr) {
    return addr.slice(0, 6) + '...' + addr.slice(-4);
}

function addShortHistory(type, number, addr = '') {
    // date 格式：MM-DD
    const today = new Date();
    const date = String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
    shortHistory.unshift({ date, type, number, addr });
}

function openHistoryModal() {
    renderHistory();
    document.getElementById('view-short-history').style.display = 'flex';
}

function closeHistoryModal() {
    document.getElementById('view-short-history').style.display = 'none';

function renderHistory() {
    const list = document.getElementById('history-list');
    const icons = { 'free_claim': '🎁', 'purchase': '💎', 'transfer_in': '📥', 'transfer_out': '📤', 'gift_out': '🎀' };
    const labels = { 'free_claim': '领取', 'purchase': '购买', 'transfer_in': '转入', 'transfer_out': '转出', 'gift_out': '赠出' };

    if (shortHistory.length === 0) {
        list.innerHTML = '<div class="text-center py-12 text-slate-400 text-xs">暂无操作记录</div>';
        return;
    }

    list.innerHTML = shortHistory.map((h, i) => {
        const isLast = i === shortHistory.length - 1;
        const dir = h.addr ? (h.type === 'transfer_in' ? '← ' + h.addr : '→ ' + h.addr) : '';
        return '<div class="flex items-center justify-between px-3 py-3 ' + (isLast ? '' : 'border-b border-slate-50') + '">' +
            '<div class="flex items-center space-x-2.5">' +
                '<span class="text-sm">' + (icons[h.type] || '·') + '</span>' +
                '<div>' +
                    '<p class="text-xs font-bold text-slate-700">' + (labels[h.type] || h.type) + ' <span class="font-mono text-slate-500">' + h.number + '</span></p>' +
                    (dir ? '<p class="text-[9px] text-slate-400 font-mono mt-0.5">' + dir + '</p>' : '') +
                '</div>' +
            '</div>' +
            '<span class="text-[10px] text-slate-400 font-mono">' + h.date + '</span>' +
        '</div>';
    }).join('');
}

function toggleDefaultAddr() {

    renderAddressEdit();
}

// 保存地址（新增/编辑）
function saveAddress(id) {
    const name = document.getElementById('addr-name').value.trim();
    const phone = document.getElementById('addr-phone').value.trim();
    const address = document.getElementById('addr-detail').value.trim();

    // 基础校验
    if (!name) { showToast('请输入收货人姓名', '⚠️'); return; }
    if (!/^1\d{10}$/.test(phone)) { showToast('请输入正确的11位手机号', '⚠️'); return; }
    if (address.length < 5) { showToast('请输入详细收货地址', '⚠️'); return; }

    const isDefault = _editingAddress ? _editingAddress.isDefault : false;

    if (id === null || id === 'null') {
        // 新增
        const newId = Math.max(0, ...MY_ADDRESSES.map(a => a.id)) + 1;
        // 如果新增的是默认，清除其他默认
        if (isDefault) MY_ADDRESSES.forEach(a => a.isDefault = false);
        MY_ADDRESSES.push({ id: newId, name, phone, address, isDefault });
        showToast('地址已添加', '✅');
    } else {
        // 编辑
        const a = MY_ADDRESSES.find(x => x.id === id);
        if (!a) return;
        a.name = name; a.phone = phone; a.address = address;
        if (isDefault && !a.isDefault) {
            MY_ADDRESSES.forEach(x => x.isDefault = false);
            a.isDefault = true;
        } else if (!isDefault && a.isDefault) {
            a.isDefault = false;
        }
        showToast('地址已更新', '✅');
    }

    _editingAddress = null;
    renderAddress();

    // 若是从结算页进入，保存后回填到结算页
    if (userState._addressFromCheckout) {
        const newSelected = MY_ADDRESSES.find(a => a.isDefault) || MY_ADDRESSES[MY_ADDRESSES.length - 1];
        if (newSelected) userState.selectedAddressId = newSelected.id;
        userState._addressFromCheckout = false;
        renderCheckout();
        openView('view-checkout');
    } else {
        openView('view-address');
    }
}

// 删除地址
function deleteAddress(id) {
    if (!confirm('确认删除该地址？')) return;
    const idx = MY_ADDRESSES.findIndex(a => a.id === id);
    if (idx === -1) return;
    const wasDefault = MY_ADDRESSES[idx].isDefault;
    MY_ADDRESSES.splice(idx, 1);
    // 若删除的是默认地址，自动将第一个设为默认
    if (wasDefault && MY_ADDRESSES.length > 0) MY_ADDRESSES[0].isDefault = true;
    // 清除已选地址
    if (userState.selectedAddressId === id) userState.selectedAddressId = null;
    _editingAddress = null;
    renderAddress();
    showToast('地址已删除', '🗑️');
    openView('view-address');
}

function setDefault(id) {
    MY_ADDRESSES.forEach(a => a.isDefault = (a.id === id));
    renderAddress();
    showToast('已设为默认', '✓');
}

            <div class="bg-amber-900 bg-opacity-30 border border-amber-600 rounded-xl p-3 mb-3">
                <div class="text-[10px] font-bold text-amber-400 mb-1">⚠️ P1 漏洞 3：积分静默失败</div>
                <div class="text-[10px] text-slate-300">AgentPoints.mint / AgentLevel.recordPoints 的 try/catch 无 emit，需后端异步对账。</div>
            </div>

            ${alerts.map(a => `
                <div class="bg-slate-800 rounded-xl p-3 mb-2">
                    <div class="flex items-center justify-between mb-1">
                        <span class="badge-${a.severity === 'P1' ? 'p1' : 'info'}">${a.severity}</span>
                        <span class="text-[10px] text-slate-400">${a.time}</span>
                    </div>
                    <div class="text-xs text-white font-bold">${a.message}</div>
                    <div class="text-[10px] text-slate-400 mt-1">refId: ${a.refId?.slice(0, 18)}...</div>
                    ${a.type === 'points_silent_fail' ? `
                        <div class="text-[10px] text-slate-300 mt-1">
                            预期积分: ${a.expectedPts} <br/>
                            AgentPoints.mint: ${a.agentPointsMinted ? '✓' : '❌'}<br/>
                            AgentLevel.recordPoints: ${a.agentLevelRecorded ? '✓' : '❌'}
                        </div>
                        <button onclick="reissuePoints(${a.id})" class="btn-primary mt-2 text-[10px] py-1.5">手动补发</button>
                    ` : ''}
                    ${a.type === 'rebate_hook_failed' ? `
                        <button onclick="reissueRebate(${a.id})" class="btn-primary mt-2 text-[10px] py-1.5">补打返利</button>
                    ` : ''}
                </div>
            `).join('')}
        ` : ''}

        ${tab === 'risk' ? `
            <!-- 风控（刷单识别） -->
            <div class="bg-amber-900 bg-opacity-30 border border-amber-600 rounded-xl p-3 mb-3">
                <div class="text-[10px] font-bold text-amber-400 mb-1">⚠️ 刷单攻击防护</div>
                <div class="text-[10px] text-slate-300">teamPoints 不扣减，需后台识别"高退货率+高 teamPoints"异常地址。</div>
            </div>

            ${risks.map(r => `
                <div class="bg-slate-800 rounded-xl p-3 mb-2">
                    <div class="flex items-center justify-between mb-1">
                        <span class="text-xs font-bold text-white">${r.label}</span>
                        <span class="badge-${r.severity === 'high' ? 'p0' : 'p1'}">${r.severity}</span>
                    </div>
                    <div class="text-[10px] text-slate-400 font-mono">${r.address.slice(0, 18)}...</div>
                    <div class="grid grid-cols-2 gap-2 mt-2 text-[10px]">
                        <div class="text-slate-300">团队人数: ${r.teamSize}</div>
                        <div class="text-slate-300">退货率: ${(r.returnRate * 100).toFixed(0)}%</div>
                        <div class="text-slate-300">teamPoints: ${r.teamPoints}</div>
                        <div class="text-slate-300">实际消费: ${r.actualSpent}</div>
                    </div>
                    <div class="text-[10px] text-amber-400 mt-2">${r.action}</div>
                    <button onclick="downgradeSybil(${r.id})" class="btn-danger mt-2 text-[10px] py-1.5">强制降级为 L0</button>
                </div>
            `).join('')}
        ` : ''}

        ${tab === 'config' ? `
            <!-- 配置 -->
            <div class="bg-slate-800 rounded-xl p-3 mb-2">
                <div class="text-xs font-bold text-white mb-2">合约地址</div>
                ${Object.entries(CONTRACTS).map(([k, v]) => `
                    <div class="flex items-center justify-between text-[10px] py-1">
                        <span class="text-slate-400">${k}</span>
                        <span class="font-mono text-slate-300">${v.slice(0, 14)}...</span>
                    </div>
                `).join('')}
            </div>

            <div class="bg-slate-800 rounded-xl p-3 mb-2">
                <div class="text-xs font-bold text-white mb-2">返利矩阵（rebateBps）</div>
                <div class="text-[10px] text-slate-400 mb-1">rank × layer（示例）</div>
                <div class="grid grid-cols-4 gap-1 text-[10px]">
                    <div class="text-slate-400">rank</div><div class="text-slate-400 text-center">L1</div><div class="text-slate-400 text-center">L2</div><div class="text-slate-400 text-center">L3</div>
                    ${Object.entries(REBATE_MATRIX).slice(0, 5).map(([rank, layers]) => `
                        <div class="text-slate-300">L${rank}</div>
                        <div class="text-center text-white">${(layers[1] * 100).toFixed(1)}%</div>
                        <div class="text-center text-white">${(layers[2] * 100).toFixed(1)}%</div>
                        <div class="text-center text-white">${(layers[3] * 100).toFixed(1)}%</div>
                    `).join('')}
                </div>
            </div>

            <div class="bg-slate-800 rounded-xl p-3 mb-2">
                <div class="text-xs font-bold text-white mb-2">升级门槛</div>
                ${UPGRADE_THRESHOLDS.map(t => `
                    <div class="flex items-center justify-between text-[10px] py-0.5">
                        <span class="text-slate-400">L${t.level}</span>
                        <span class="text-slate-300">${t.threshold} ${t.basis === 1 ? '团队' : '个人'}</span>
                    </div>
                `).join('')}
            </div>

            <div class="alert-p1 rounded-xl p-3 mb-2">
                <div class="text-[10px] font-bold text-amber-400">⚠️ 多签钱包要求</div>
                <div class="text-[10px] text-slate-300 mt-1">miner 地址必须是 Gnosis Safe 2/3 多签钱包，避免 approveReturn 抽干合约攻击。</div>
            </div>
        ` : ''}
        </div>
    `;
}

function approveReturn(id) {
    const refundAmount = parseFloat(document.getElementById(`refund-amount-${id}`).value);
    if (refundAmount > 500) {
        showToast('金额超阈值，需第二 miner 复核', '⚠️');
        return;
    }
    ADMIN_DATA.pendingReturns = ADMIN_DATA.pendingReturns.filter(r => r.id !== id);
    showToast('退货已审核通过（多签）', '✅');
    renderAdmin('return');
}

function rejectReturn(id) {
    ADMIN_DATA.pendingReturns = ADMIN_DATA.pendingReturns.filter(r => r.id !== id);
    showToast('退货已驳回', '✓');
    renderAdmin('return');
}

function reissuePoints(id) {
    const alert = ADMIN_DATA.reconcileAlerts.find(a => a.id === id);
    if (alert) { alert.agentPointsMinted = true; showToast('积分已手动补发', '✅'); }
    renderAdmin('reconcile');
}

function reissueRebate(id) {
    const alert = ADMIN_DATA.reconcileAlerts.find(a => a.id === id);
    if (alert) { alert.resolved = true; showToast('返利已补打', '✅'); }
    renderAdmin('reconcile');
}

function downgradeSybil(id) {
    const risk = ADMIN_DATA.riskAlerts.find(r => r.id === id);
    if (risk) { risk.resolved = true; showToast('已调用 minerSetLevel 降级为 L0', '✅'); }
    renderAdmin('risk');
}

// ---------- 初始化 ----------
function init() {
    console.log('🚀 Node 商城 v4.0.1 启动');
    console.log('📋 基于 v1.5 方案，含 P0/P1 漏洞防护');
    console.log('📌 三大决策：1) 仅官方上架 2) 全平台统一商品池 3) 取消代销概念');
    console.log('📌 v4.0.1: 移除首页身份卡，4 大功能入口上移至 Banner 下方');

    renderRoleDetail();
    renderHotProducts();
    renderProductGrid('all');

    // 默认代理角色
    switchRole('agent');
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}
</script>

</body>
</html>
